version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Mongoose 9 changes query-update result typings used by payment transitions;
      # review and validate the payment state machine before allowing a major upgrade.
      - dependency-name: mongoose
        update-types:
          - version-update:semver-major
      # typescript-eslint 8.72.1 supports TypeScript <6.1; TypeScript 7 cannot resolve.
      # This still permits the compatible TypeScript 6.0 line to be proposed.
      - dependency-name: typescript
        versions:
          - ">=6.1.0"

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # plugin-react 4.7.0 supports Vite through 7, not Vite 8.
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      # Keep React and its renderer/types on the project's supported React 18 major.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
      # typescript-eslint 8.72.1 supports TypeScript <6.1; TypeScript 7 cannot resolve.
      # This still permits the compatible TypeScript 6.0 line to be proposed.
      - dependency-name: typescript
        versions:
          - ">=6.1.0"
